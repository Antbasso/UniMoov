name: unimoov
description: "Uni-Moov : covoiturage domicile-campus pour étudiants."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  dio: ^5.11.1
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: ^7.0.2
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  geolocator: ^14.1.1
  go_router: ^18.1.0
  intl: any
  latlong2: ^0.9.1
  url_launcher: ^6.3.3
  vector_map_tiles: ^8.0.0
  vector_map_tiles_pmtiles: ^1.5.0
  vector_tile_renderer: ^5.2.1
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
  fonts:
    - family: UniMoov Display
      fonts:
        - asset: assets/fonts/UniMoovDisplay-SemiBold.ttf
          weight: 600
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
    - family: Caveat
      fonts:
        - asset: assets/fonts/Caveat-SemiBold.ttf
          weight: 600
