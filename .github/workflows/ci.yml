name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: unimoov
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: unimoov_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U unimoov -d unimoov_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://unimoov:ci@localhost:5432/unimoov_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - name: Image Docker de l'API
        run: docker build -t unimoov-api .

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Fichiers générés à jour (thème, traductions)
        run: |
          dart run tool/generate_tokens.dart
          flutter gen-l10n
          git diff --exit-code -- lib
      - name: Format (hors traductions générées)
        run: dart format --line-length 100 --set-exit-if-changed $(git ls-files '*.dart' | grep -v 'lib/l10n/app_localizations')
      - run: flutter analyze
      - run: flutter test
