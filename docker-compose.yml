services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-unimoov}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définis POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-unimoov}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      JWT_SECRET: ${JWT_SECRET:?définis JWT_SECRET dans .env}
      CALENDAR_ENCRYPTION_KEY: ${CALENDAR_ENCRYPTION_KEY:?définis CALENDAR_ENCRYPTION_KEY dans .env}
      JOBS_ENABLED: ${JOBS_ENABLED:-true}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-console}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      GEOCODING_PROVIDER: ${GEOCODING_PROVIDER:-ban}
      ROUTING_PROVIDER: ${ROUTING_PROVIDER:-estimate}
      ORS_API_KEY: ${ORS_API_KEY:-}
      OSRM_URL: ${OSRM_URL:-https://router.project-osrm.org}
      ROUTING_DAILY_QUOTA: ${ROUTING_DAILY_QUOTA:-2000}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-fake}
      PUSH_PROVIDER: ${PUSH_PROVIDER:-log}
      FCM_SERVICE_ACCOUNT_FILE: ${FCM_SERVICE_ACCOUNT_FILE:-}
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-unimoov}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-unimoov}
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    volumes:
      # Secrets de l'API seulement (clé Firebase), posés à la main (jamais commités) ; la phrase
      # de passe des sauvegardes reste hors de portée de l'API.
      - ./secrets/api:/run/secrets:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
