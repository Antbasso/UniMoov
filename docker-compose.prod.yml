# Surcharge de production : docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Seul Caddy est exposé (80/443) ; l'API et la base restent sur le réseau interne.
services:
  db:
    ports: !reset []
    restart: unless-stopped

  api:
    ports: !reset []
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      TRUST_PROXY: "true"

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?définis DOMAIN dans .env}
      ACME_EMAIL: ${ACME_EMAIL:-unimoov.support@gmail.com}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./tiles:/srv/tiles:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
